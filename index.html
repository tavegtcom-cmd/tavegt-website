<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b72">
<title>TAVEGT LTD - Services & Store</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<a class="brand" href="#">TAVEGT LTD</a>
<a class="whatsapp" href="https://wa.me/917302271502">WhatsApp</a>
</header>
<section class="hero">
<h1>चुनिए, अपनी पसंद</h1>
<p>Services और Shopping अब एक ही जगह</p>
<a class="primary" href="#services">Explore Now</a>
</section>
<main>
<section id="services">
<h2>Our Services</h2>
<div id="serviceList" class="cards"></div>
</section>
<section id="store">
<h2>TAVEGT STORE</h2>
<input id="searchProduct" placeholder="Search Products">
<div id="productList" class="cards"></div>
</section>
<section id="orders">
<h2>My Orders / Booking</h2>
<div class="panel">
<input id="customerName" placeholder="Your Name">
<textarea id="customerAddress" placeholder="Your Address"></textarea>
<select id="paymentMode">
<option>Cash on Delivery</option>
<option>Online Payment</option>
</select>
<button class="primary" id="checkoutBtn">WhatsApp Order</button>
</div>
</section>
<section id="admin">
<h2>Admin Panel</h2>
<div class="panel">
<input id="adminPin" type="password" placeholder="Admin PIN">
<button id="unlockAdmin">Login</button>
<div id="adminArea" hidden>
<input id="newProductName" placeholder="Product Name">
<input id="newProductPrice" placeholder="Price">
<select id="newProductCategory">
<option>Food</option><option>Home</option>
<option>Daily Needs</option><option>Other</option>
</select>
<button id="addProduct">Add Product</button>
<div id="adminProductList"></div>
</div>
</div>
</section>
</main>
<footer>TAVEGT LTD | Meerut, Uttar Pradesh</footer>
<script src="app.js"></script>
</body>
</html>
